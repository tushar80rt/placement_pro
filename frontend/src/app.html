<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<!-- DNS prefetch + preconnect for Google Fonts — eliminates connection latency -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Preconnect for logo/favicon API (Google favicon service) -->
		<link rel="preconnect" href="https://t3.gstatic.com" />

		<!-- Theme color for browser chrome on mobile -->
		<meta name="theme-color" content="#fff8f4" />
		<meta name="color-scheme" content="light" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
